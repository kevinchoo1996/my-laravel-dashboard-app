openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: 'Login user'
      operationId: loginUser
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'User email'
                  example: qkunze@example.com
                password:
                  type: string
                  description: 'User password'
                  example: 'O[2UZ5ij-e/dl4m{o,'
              required:
                - email
                - password
  /api/inventory/products:
    get:
      summary: 'List products'
      operationId: listProducts
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
    post:
      summary: 'Create product'
      operationId: createProduct
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                category_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example: consequatur
                price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 45
                stock:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 56
                enabled:
                  type: boolean
                  description: ''
                  example: true
              required:
                - name
                - category_id
                - price
                - stock
                - enabled
  '/api/inventory/products/{id}':
    get:
      summary: 'Get product'
      operationId: getProduct
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
    put:
      summary: 'Update product'
      operationId: updateProduct
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                category_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the categories table.'
                  example: consequatur
                price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 45
                stock:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 56
                enabled:
                  type: boolean
                  description: ''
                  example: true
              required:
                - name
                - category_id
                - price
                - stock
                - enabled
    delete:
      summary: 'Delete products'
      operationId: deleteProducts
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
  /api/inventory/products/bulk-delete:
    delete:
      summary: 'Bulk Delete Product'
      operationId: bulkDeleteProduct
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                selected:
                  type: array
                  description: 'The <code>id</code> of an existing record in the products table.'
                  example:
                    - 17
                  items:
                    type: integer
